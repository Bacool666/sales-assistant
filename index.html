<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6b4b"><meta name="description" content="Dashboard operasional sales untuk toko, order, percakapan, dan laporan.">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Sales Assistant</title>
<style>
:root{--green:#08734e;--green2:#0b8c60;--mint:#e9f7f0;--ink:#17251f;--muted:#738078;--line:#e5ece8;--bg:#f5f8f6;--white:#fff;--amber:#a76509;--red:#b64040;--shadow:0 8px 28px #153d2910}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 15px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:0 9px}.brand-mark{width:39px;height:39px;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}.brand b{display:block;font-size:17px}.brand small{color:var(--muted)}.nav-label{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#9aa69f;padding:0 12px;margin-bottom:7px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#65736b;text-align:left;padding:11px 12px;border-radius:11px;display:flex;align-items:center;gap:12px;font-weight:650}.nav button.active,.nav button:hover{background:var(--mint);color:var(--green)}.ico{width:20px;text-align:center;font-size:17px}.side-note{margin-top:auto;background:#f2f8f4;border:1px solid #e2eee6;padding:13px;border-radius:13px;font-size:12px;color:#5c6c62}.main{min-width:0}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.topbar .date{color:var(--muted);font-size:13px}.user{display:flex;align-items:center;gap:10px;font-weight:700}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#dff2e8;color:var(--green)}.content{max-width:1320px;margin:auto;padding:28px 30px 80px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:23px}.page-head h1{font-size:25px;margin:0 0 5px;letter-spacing:-.5px}.sub{color:var(--muted);font-size:13px}.btn{border:0;background:var(--green);color:#fff;border-radius:10px;padding:10px 15px;font-weight:700}.btn:hover{background:#075c3e}.btn.light{background:#eef6f1;color:var(--green)}.btn.outline{background:#fff;color:var(--green);border:1px solid #cfe3d7}.btn.danger{background:#fff0f0;color:var(--red)}.btn.small{padding:7px 10px;font-size:12px}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:650}.stat-icon{width:34px;height:34px;background:var(--mint);color:var(--green);display:grid;place-items:center;border-radius:10px;font-size:17px}.stat-value{font-size:28px;font-weight:800;margin:12px 0 2px;letter-spacing:-1px}.stat-foot{font-size:11px;color:var(--muted)}.two{grid-template-columns:1.35fr 1fr}.card h3{margin:0 0 14px;font-size:15px}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.card-head h3{margin:0}.link{color:var(--green);font-size:12px;font-weight:750;border:0;background:none}.empty{padding:30px 12px;text-align:center;color:var(--muted);font-size:13px}.empty strong{display:block;color:var(--ink);margin-bottom:4px}.list{display:grid;gap:0}.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf1ee}.list-row:last-child{border:0}.store-name{font-weight:700;font-size:13px}.meta{font-size:11px;color:var(--muted);margin-top:3px}.pill{font-size:10px;font-weight:750;padding:5px 8px;border-radius:99px;background:#eef5f0;color:#557064;white-space:nowrap}.pill.green{background:#e5f6ed;color:#08734e}.pill.amber{background:#fff3df;color:#a76509}.pill.red{background:#fff0f0;color:#b64040}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}.table{border-collapse:collapse;width:100%;min-width:620px}.table th,.table td{text-align:left;padding:13px 15px;border-bottom:1px solid #edf1ee;font-size:13px}.table th{background:#f8faf8;color:#718077;font-size:10px;text-transform:uppercase;letter-spacing:.7px}.table tr:last-child td{border-bottom:0}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.field{border:1px solid #dfe8e2;border-radius:9px;padding:10px 11px;background:#fff;min-width:0;width:100%;outline:none}.field:focus{border-color:#71b99a;box-shadow:0 0 0 3px #dff2e8}.search{max-width:310px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}label{font-size:12px;font-weight:700;color:#59685f;display:grid;gap:6px}.modal-back{position:fixed;inset:0;background:#10291e66;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}.modal-back.show{display:flex}.modal{background:#fff;border-radius:17px;padding:21px;width:min(540px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px #10291e40}.modal h2{font-size:18px;margin:0 0 17px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.tabs{display:flex;gap:7px;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;color:#68766e;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:700}.tab.active{background:var(--mint);border-color:#cce6d7;color:var(--green)}.message{border:1px solid var(--line);padding:13px;border-radius:12px;margin-bottom:9px}.message-top{display:flex;justify-content:space-between;gap:10px}.message p{margin:9px 0;color:#536158;font-size:13px}.draft{background:#f7fbf8;border:1px dashed #b9d7c5;padding:12px;border-radius:10px;font-size:13px;margin-top:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.notice{padding:12px 14px;border-radius:11px;background:#fff8e9;color:#805516;border:1px solid #f2e2bd;font-size:12px;margin-bottom:15px}.report-box{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.report-box>div{padding:13px;background:#f7faf8;border-radius:11px}.report-box b{font-size:22px;display:block}.mobile-nav{display:none}.hidden{display:none!important}.muted{color:var(--muted)}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar{display:none}.topbar{height:60px;padding:0 16px}.content{padding:22px 16px 92px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:10;justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:none;color:#738078;font-size:10px;display:grid;gap:3px;justify-items:center;min-width:48px}.mobile-nav button.active{color:var(--green);font-weight:800}.mobile-nav span:first-child{font-size:18px}.page-head h1{font-size:22px}.topbar .date{display:none}}@media(max-width:420px){.stats{gap:9px}.card{padding:14px}.stat-value{font-size:25px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.page-head{align-items:center}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">S</div><div><b>Sales Assistant</b><small>Sales workspace</small></div></div><div><div class="nav-label">MENU UTAMA</div><nav class="nav" id="sideNav"></nav></div><div class="side-note"><b>Mode demo lokal</b><br>Data tersimpan di perangkat ini. WhatsApp belum terhubung.</div></aside><main class="main"><header class="topbar"><div class="date" id="today"></div><div class="user"><div class="avatar">SA</div><span>Sales Admin</span></div></header><div class="content" id="view"></div></main></div><nav class="mobile-nav" id="mobileNav"></nav>
<div class="modal-back" id="modalBack"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modal-actions" id="modalActions"></div></div></div>
<script>
const navItems=[['dashboard','▦','Dashboard'],['inbox','▣','WhatsApp Center'],['stores','♙','Database Toko'],['orders','▤','Manajemen Order'],['reminders','♧','Pengingat Toko'],['reports','▥','Laporan Sales'],['settings','⚙','Pengaturan']];
const seedStores=[{id:1,name:'Batuah Jaya',phone:'',area:'Palangka Raya',frequency:'2–3 hari',lastOrder:'2026-11-23',notes:'Pelanggan aktif'},{id:2,name:'Mentaya',phone:'',area:'Palangka Raya',frequency:'Mingguan',lastOrder:'2026-11-23',notes:''},{id:3,name:'Lisa',phone:'',area:'Palangka Raya',frequency:'2–3 hari',lastOrder:'2026-11-21',notes:''},{id:4,name:'Dehes Rajaki',phone:'',area:'Palangka Raya',frequency:'Mingguan',lastOrder:'2026-11-20',notes:''}];
let db=load();let page='dashboard';let inboxFilter='all';
function load(){try{return JSON.parse(localStorage.getItem('salesAssistantDB'))||{stores:seedStores,orders:[],messages:[],drafts:[],settings:{owner:'Sales Admin'}}}catch(e){return {stores:seedStores,orders:[],messages:[],drafts:[],settings:{owner:'Sales Admin'}}}}
function save(){localStorage.setItem('salesAssistantDB',JSON.stringify(db));}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(s){if(!s)return '—';return new Date(s+'T00:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
function todayISO(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function setPage(p){page=p;render();}
function renderNav(){let html=navItems.map(([id,ic,n])=>`<button class="${page===id?'active':''}" data-page="${id}"><span class="ico">${ic}</span>${n}</button>`).join('');document.getElementById('sideNav').innerHTML=html;document.getElementById('mobileNav').innerHTML=navItems.slice(0,5).map(([id,ic,n])=>`<button class="${page===id?'active':''}" data-page="${id}"><span>${ic}</span>${n}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));}
function header(title,sub,action=''){return `<div class="page-head"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${action}</div>`}
function stat(label,val,foot,ic){return `<div class="card"><div class="stat-top"><span>${label}</span><span class="stat-icon">${ic}</span></div><div class="stat-value">${val}</div><div class="stat-foot">${foot}</div></div>`}
function dashboard(){let todayOrders=db.orders.filter(o=>o.date===todayISO());let todayDus=todayOrders.reduce((a,o)=>a+Number(o.totalDus||0),0);let awaiting=db.drafts.filter(d=>d.status==='Menunggu persetujuan').length;let ordered=new Set(todayOrders.map(o=>o.storeId));let noOrder=db.stores.filter(s=>!ordered.has(s.id));return header('Dashboard','Ringkasan aktivitas penjualan dan toko langganan.')+`<div class="grid stats">${stat('Total toko',db.stores.length,'Toko dalam database','♙')}${stat('Order hari ini',todayOrders.length,'Transaksi tercatat','▤')}${stat('Total dus hari ini',todayDus.toLocaleString('id-ID'),'Berdasarkan order tersimpan','▦')}${stat('Draft menunggu',awaiting,'Perlu pemeriksaan kamu','✉')}</div><div class="grid two"><section class="card"><div class="card-head"><h3>Order terbaru</h3><button class="link" data-go="orders">Lihat semua →</button></div>${db.orders.length?`<div class="list">${db.orders.slice().sort((a,b)=>(b.date+b.id)-(a.date+a.id)).slice(0,5).map(o=>`<div class="list-row"><div><div class="store-name">${esc(storeName(o.storeId))}</div><div class="meta">${fmtDate(o.date)} · ${esc(o.items||'')}</div></div><b>${o.totalDus} dus</b></div>`).join('')}</div>`:`<div class="empty"><strong>Belum ada order tercatat</strong>Tambahkan order pertama untuk mulai membuat laporan.</div>`}</section><section class="card"><div class="card-head"><h3>Perlu follow-up</h3><button class="link" data-go="reminders">Lihat daftar →</button></div>${noOrder.length?`<div class="list">${noOrder.slice(0,5).map(s=>`<div class="list-row"><div><div class="store-name">${esc(s.name)}</div><div class="meta">Order terakhir: ${fmtDate(s.lastOrder)}</div></div><span class="pill amber">Belum order hari ini</span></div>`).join('')}</div>`:`<div class="empty">Semua toko sudah memiliki order hari ini.</div>`}</section></div><div class="notice" style="margin-top:15px"><b>Mode demo:</b> data di aplikasi ini tersimpan lokal pada browser HP. Chat WhatsApp belum tersambung dan tidak ada pesan yang dikirim.</div>`}
function storeName(id){return db.stores.find(s=>s.id===Number(id))?.name||'Toko tidak ditemukan'}
function stores(){return header('Database Toko','Kelola daftar toko, kontak, area, dan kebiasaan order.',`<button class="btn" id="addStore">＋ Tambah toko</button>`)+`<div class="toolbar"><input class="field search" id="storeSearch" placeholder="Cari nama toko atau area..."><span class="sub">${db.stores.length} toko tersimpan</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Nama toko</th><th>Nomor WhatsApp</th><th>Area</th><th>Frekuensi</th><th>Order terakhir</th><th>Aksi</th></tr></thead><tbody id="storeRows">${storeRows(db.stores)}</tbody></table></div>`}
function storeRows(arr){return arr.length?arr.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="meta">${esc(s.notes)}</div></td><td>${esc(s.phone||'Belum diisi')}</td><td>${esc(s.area||'—')}</td><td>${esc(s.frequency||'—')}</td><td>${fmtDate(s.lastOrder)}</td><td><button class="btn light small" data-edit-store="${s.id}">Edit</button> <button class="btn danger small" data-delete-store="${s.id}">Hapus</button></td></tr>`).join(''):`<tr><td colspan="6" class="empty">Belum ada data toko.</td></tr>`}
function orders(){return header('Manajemen Order','Catat pesanan toko dan simpan detail barang.',`<button class="btn" id="addOrder">＋ Catat order</button>`)+`<div class="toolbar"><input class="field search" id="orderSearch" placeholder="Cari toko atau barang..."></div><div class="table-wrap"><table class="table"><thead><tr><th>Tanggal</th><th>Nama toko</th><th>Detail barang</th><th>Total dus</th><th>Status</th></tr></thead><tbody id="orderRows">${orderRows(db.orders)}</tbody></table></div>`}
function orderRows(arr){return arr.length?arr.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(o=>`<tr><td>${fmtDate(o.date)}</td><td><b>${esc(storeName(o.storeId))}</b></td><td>${esc(o.items)}</td><td><b>${o.totalDus}</b></td><td><span class="pill green">Tercatat</span></td></tr>`).join(''):`<tr><td colspan="5" class="empty">Belum ada order. Gunakan tombol Catat order.</td></tr>`}
function inbox(){let msgs=db.messages.filter(m=>inboxFilter==='all'||m.type===inboxFilter);return header('WhatsApp Center','Pusat percakapan dan draft balasan. Integrasi WhatsApp belum aktif.',`<button class="btn" id="simulateMsg">＋ Simulasi chat</button>`)+`<div class="notice">Inbox ini adalah simulasi lokal untuk menguji alur. Pesan di sini bukan percakapan WhatsApp asli.</div><div class="tabs"><button class="tab ${inboxFilter==='all'?'active':''}" data-filter="all">Semua</button><button class="tab ${inboxFilter==='order'?'active':''}" data-filter="order">Order</button><button class="tab ${inboxFilter==='question'?'active':''}" data-filter="question">Pertanyaan</button><button class="tab ${inboxFilter==='complaint'?'active':''}" data-filter="complaint">Komplain</button></div><div class="grid two"><section class="card"><h3>Pesan masuk</h3>${msgs.length?msgs.slice().reverse().map(m=>`<div class="message"><div class="message-top"><b>${esc(storeName(m.storeId))}</b><span class="pill">${esc(m.type)}</span></div><p>${esc(m.text)}</p><div class="meta">${fmtDate(m.date)} · ${esc(m.time||'')}</div><div class="actions"><button class="btn light small" data-draft="${m.id}">Buat draft balasan</button></div></div>`).join(''):`<div class="empty"><strong>Belum ada pesan</strong>Tambahkan simulasi chat untuk mencoba fitur.</div>`}</section><section class="card"><h3>Draft dan persetujuan</h3>${db.drafts.length?db.drafts.slice().reverse().map(d=>`<div class="message"><div class="message-top"><b>${esc(storeName(d.storeId))}</b><span class="pill ${d.status==='Disetujui'?'green':'amber'}">${esc(d.status)}</span></div><div class="draft">${esc(d.text)}</div><div class="actions">${d.status==='Menunggu persetujuan'?`<button class="btn small" data-approve="${d.id}">Setujui draft</button><button class="btn light small" data-edit-draft="${d.id}">Edit</button>`:''}</div></div>`).join(''):`<div class="empty">Belum ada draft balasan.</div>`}</section></div>`}
function reminders(){let ordered=new Set(db.orders.filter(o=>o.date===todayISO()).map(o=>o.storeId));let list=db.stores.filter(s=>!ordered.has(s.id));return header('Pengingat Toko','Prioritaskan follow-up berdasarkan riwayat order. Pesan tidak dikirim otomatis.')+`<div class="notice">Pengingat di bawah adalah rekomendasi internal. Periksa jadwal toko dan hindari mengirim pesan berulang atau tanpa izin yang sesuai.</div><div class="card"><div class="card-head"><h3>Toko belum order hari ini</h3><span class="pill amber">${list.length} toko</span></div>${list.length?`<div class="list">${list.map(s=>`<div class="list-row"><div><div class="store-name">${esc(s.name)}</div><div class="meta">${esc(s.area)} · Frekuensi ${esc(s.frequency)} · Terakhir ${fmtDate(s.lastOrder)}</div></div><button class="btn light small" data-remind="${s.id}">Siapkan pesan</button></div>`).join('')}</div>`:`<div class="empty">Tidak ada toko yang perlu di-follow-up.</div>`}</div>`}
function reports(){let total=db.orders.reduce((a,o)=>a+Number(o.totalDus||0),0);let month=db.orders.filter(o=>o.date.slice(0,7)===todayISO().slice(0,7));let monthly=month.reduce((a,o)=>a+Number(o.totalDus||0),0);let active=new Set(month.map(o=>o.storeId)).size;return header('Laporan Sales','Ringkasan berdasarkan order yang dicatat di aplikasi.')+`<div class="grid stats">${stat('Total transaksi',db.orders.length,'Seluruh data','▤')}${stat('Total dus',total,'Seluruh periode','▦')}${stat('Dus bulan ini',monthly,'Bulan berjalan','▥')}${stat('Toko aktif bulan ini',active,'Memiliki order tercatat','♙')}</div><div class="card"><div class="card-head"><h3>Rekap toko bulan ini</h3><button class="btn outline small" id="exportCsv">Ekspor CSV</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Toko</th><th>Jumlah transaksi</th><th>Total dus</th></tr></thead><tbody>${db.stores.map(s=>{let os=month.filter(o=>o.storeId===s.id);return `<tr><td><b>${esc(s.name)}</b></td><td>${os.length}</td><td>${os.reduce((a,o)=>a+Number(o.totalDus),0)}</td></tr>`}).join('')}</tbody></table></div></div>`}
function settings(){return header('Pengaturan','Kelola data aplikasi dan status integrasi.')+`<div class="grid two"><section class="card"><h3>Status koneksi</h3><div class="list-row"><span>WhatsApp Business API</span><span class="pill amber">Belum terhubung</span></div><div class="list-row"><span>AI API</span><span class="pill amber">Belum dikonfigurasi</span></div><div class="list-row"><span>Database</span><span class="pill green">Lokal aktif</span></div><div class="notice" style="margin-top:15px">Jangan masukkan token API, OTP, PIN, atau kredensial rahasia ke aplikasi demo ini.</div></section><section class="card"><h3>Cadangan dan pemulihan data</h3><p class="sub">Ekspor data untuk menyimpan cadangan atau pindahkan ke perangkat lain.</p><div class="actions"><button class="btn" id="backup">Unduh backup JSON</button><label class="btn light" style="display:inline-flex;cursor:pointer">Impor backup<input type="file" id="restore" accept="application/json" hidden></label></div><div style="height:15px"></div><button class="btn danger small" id="reset">Reset data demo</button></section></div><div class="card" style="margin-top:15px"><h3>Informasi aplikasi</h3><div class="list-row"><span>Nama</span><b>Sales Assistant</b></div><div class="list-row"><span>Versi</span><b>0.1.0 MVP</b></div><div class="list-row"><span>Mode</span><b>Progressive Web App · Lokal</b></div></div>`}
function render(){renderNav();document.getElementById('today').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});let pages={dashboard,stores,orders,inbox,reminders,reports,settings};document.getElementById('view').innerHTML=pages[page]();wire();}
function openModal(title,body,actions){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalActions').innerHTML=actions;document.getElementById('modalBack').classList.add('show');document.getElementById('modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()};}
function closeModal(){document.getElementById('modalBack').classList.remove('show')}
function wire(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setPage(b.dataset.go));let a=document.getElementById('addStore');if(a)a.onclick=()=>storeModal();let os=document.getElementById('storeSearch');if(os)os.oninput=()=>document.getElementById('storeRows').innerHTML=storeRows(db.stores.filter(s=>(s.name+s.area+s.phone).toLowerCase().includes(os.value.toLowerCase())));document.querySelectorAll('[data-edit-store]').forEach(b=>b.onclick=()=>storeModal(Number(b.dataset.editStore)));document.querySelectorAll('[data-delete-store]').forEach(b=>b.onclick=()=>{if(confirm('Hapus toko ini?')){db.stores=db.stores.filter(s=>s.id!==Number(b.dataset.deleteStore));save();render()}});let ao=document.getElementById('addOrder');if(ao)ao.onclick=()=>orderModal();let oq=document.getElementById('orderSearch');if(oq)oq.oninput=()=>document.getElementById('orderRows').innerHTML=orderRows(db.orders.filter(o=>(storeName(o.storeId)+o.items).toLowerCase().includes(oq.value.toLowerCase())));let sm=document.getElementById('simulateMsg');if(sm)sm.onclick=()=>messageModal();document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{inboxFilter=b.dataset.filter;render()});document.querySelectorAll('[data-draft]').forEach(b=>b.onclick=()=>draftFromMessage(Number(b.dataset.draft)));document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{let d=db.drafts.find(x=>x.id===Number(b.dataset.approve));if(d&&confirm('Setujui draft ini? Persetujuan hanya menandai siap ditinjau untuk pengiriman; tidak mengirim WhatsApp.')){d.status='Disetujui';save();render()}});document.querySelectorAll('[data-edit-draft]').forEach(b=>b.onclick=()=>editDraft(Number(b.dataset.editDraft)));document.querySelectorAll('[data-remind]').forEach(b=>b.onclick=()=>reminderDraft(Number(b.dataset.remind)));let ex=document.getElementById('exportCsv');if(ex)ex.onclick=exportCSV;let bk=document.getElementById('backup');if(bk)bk.onclick=backup;let rs=document.getElementById('restore');if(rs)rs.onchange=restore;let re=document.getElementById('reset');if(re)re.onclick=()=>{if(confirm('Reset seluruh data demo di perangkat ini?')){db={stores:seedStores,orders:[],messages:[],drafts:[],settings:{owner:'Sales Admin'}};save();render()}};}
function storeModal(id){let s=id?db.stores.find(x=>x.id===id):{};openModal(id?'Edit toko':'Tambah toko',`<div class="form-grid"><label>Nama toko *<input class="field" id="fName" value="${esc(s.name||'')}" placeholder="Nama toko"></label><label>Nomor WhatsApp<input class="field" id="fPhone" value="${esc(s.phone||'')}" placeholder="08xxxxxxxxxx"></label><label>Area<input class="field" id="fArea" value="${esc(s.area||'')}" placeholder="Area toko"></label><label>Frekuensi order<select class="field" id="fFreq"><option>Setiap hari</option><option ${s.frequency==='2–3 hari'?'selected':''}>2–3 hari</option><option ${s.frequency==='Mingguan'?'selected':''}>Mingguan</option><option>Bulanan</option><option>Tidak tentu</option></select></label><label>Order terakhir<input class="field" type="date" id="fLast" value="${s.lastOrder||''}"></label><label class="full">Catatan<textarea class="field" id="fNotes" rows="2">${esc(s.notes||'')}</textarea></label></div>`,`<button class="btn light" id="cancel">Batal</button><button class="btn" id="saveStore">Simpan toko</button>`);document.getElementById('cancel').onclick=closeModal;document.getElementById('saveStore').onclick=()=>{let name=document.getElementById('fName').value.trim();if(!name)return alert('Nama toko wajib diisi.');let v={id:id||Date.now(),name,phone:document.getElementById('fPhone').value.trim(),area:document.getElementById('fArea').value.trim(),frequency:document.getElementById('fFreq').value,lastOrder:document.getElementById('fLast').value,notes:document.getElementById('fNotes').value.trim()};if(id)db.stores=db.stores.map(x=>x.id===id?v:x);else db.stores.push(v);save();closeModal();render()}}
function orderModal(){if(!db.stores.length)return alert('Tambahkan toko terlebih dahulu.');openModal('Catat order',`<div class="form-grid"><label>Toko *<select class="field" id="oStore">${db.stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><label>Tanggal<input class="field" type="date" id="oDate" value="${todayISO()}"></label><label class="full">Detail barang *<textarea class="field" id="oItems" rows="3" placeholder="AM 7 dus, WP 5 dus, Atlas Leci 2 dus"></textarea></label><label>Total dus *<input class="field" type="number" min="0" id="oTotal" placeholder="14"></label></div>`,`<button class="btn light" id="cancel">Batal</button><button class="btn" id="saveOrder">Simpan order</button>`);document.getElementById('cancel').onclick=closeModal;document.getElementById('saveOrder').onclick=()=>{let items=document.getElementById('oItems').value.trim(),total=Number(document.getElementById('oTotal').value);if(!items||!Number.isFinite(total)||total<0)return alert('Isi detail barang dan total dus dengan benar.');let storeId=Number(document.getElementById('oStore').value),date=document.getElementById('oDate').value;db.orders.push({id:Date.now(),storeId,date,items,totalDus:total});let s=db.stores.find(x=>x.id===storeId);if(s)s.lastOrder=date;save();closeModal();render()}}
function messageModal(){openModal('Simulasi pesan masuk',`<div class="form-grid"><label>Toko<select class="field" id="mStore">${db.stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><label>Kategori<select class="field" id="mType"><option value="order">Order</option><option value="question">Pertanyaan</option><option value="complaint">Komplain</option><option value="other">Lainnya</option></select></label><label class="full">Isi pesan<textarea class="field" id="mText" rows="4" placeholder="Contoh: AM 5 dus, WP 3 dus"></textarea></label></div>`,`<button class="btn light" id="cancel">Batal</button><button class="btn" id="saveMsg">Tambahkan simulasi</button>`);document.getElementById('cancel').onclick=closeModal;document.getElementById('saveMsg').onclick=()=>{let text=document.getElementById('mText').value.trim();if(!text)return alert('Isi pesan terlebih dahulu.');db.messages.push({id:Date.now(),storeId:Number(document.getElementById('mStore').value),type:document.getElementById('mType').value,text,date:todayISO(),time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})});save();closeModal();render()}}
function draftFromMessage(id){let m=db.messages.find(x=>x.id===id);if(!m)return;let text=m.type==='order'?'Terima kasih, Pak. Order sudah kami terima. Kami akan periksa detail pesanan dan mengonfirmasi kembali.':'Baik, Pak. Terima kasih informasinya. Kami akan bantu tindak lanjuti.';db.drafts.push({id:Date.now(),storeId:m.storeId,text,status:'Menunggu persetujuan',messageId:id});save();render()}
function reminderDraft(id){let s=db.stores.find(x=>x.id===id);if(!s)return;db.drafts.push({id:Date.now(),storeId:id,text:`Selamat pagi, Pak. Izin mengingatkan, apakah hari ini ada orderan yang ingin ditambahkan? Jika ada, boleh diinformasikan agar bisa kami proses. Terima kasih.`,status:'Menunggu persetujuan'});save();setPage('inbox')}
function editDraft(id){let d=db.drafts.find(x=>x.id===id);if(!d)return;openModal('Edit draft pesan',`<label>Isi pesan<textarea class="field" id="draftText" rows="5">${esc(d.text)}</textarea></label>`,`<button class="btn light" id="cancel">Batal</button><button class="btn" id="saveDraft">Simpan perubahan</button>`);document.getElementById('cancel').onclick=closeModal;document.getElementById('saveDraft').onclick=()=>{d.text=document.getElementById('draftText').value;d.status='Menunggu persetujuan';save();closeModal();render()}}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});download(blob,'sales-assistant-backup.json')}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.stores||!x.orders||!x.messages||!x.drafts)throw Error();db=x;save();render();alert('Backup berhasil dipulihkan.')}catch(err){alert('File backup tidak valid.')}};r.readAsText(f)}
function exportCSV(){let rows=[['Tanggal','Toko','Detail Barang','Total Dus'],...db.orders.map(o=>[o.date,storeName(o.storeId),o.items,o.totalDus])];let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'laporan-sales.csv')}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
render();
if('serviceWorker' in navigator && location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
</script></body></html>
